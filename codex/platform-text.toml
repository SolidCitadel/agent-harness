# 공통 원본의 {{platform:이름}} 빈칸에 들어갈 Codex 문구. 키가 빈칸 이름이고 값 전체가 삽입된다.
# 빈 값을 받은 빈칸이 한 줄을 차지하면 그 줄과 인접한 빈 줄 하나를 지운다.

"전역 지침 제목" = '''전역 AGENTS.md'''

"수행 절차" = '''
하네스 구성물을 작성·수정·이동·삭제·검수할 때 `~/.codex/harness-authoring.md`와 `~/.codex/harness-components.md`에서 대상 유형의 규율을 읽는다.
'''

"서브에이전트 모델" = '''범위가 명확한 하위 작업에는 `gpt-6-luna`를 우선 사용하되, 판단 난도와 오류 비용에 맞춰 모델을 선택한다.'''

"하네스 작성 규율" = '''`~/.codex/harness-authoring.md`와 `~/.codex/harness-components.md`'''

"하네스 검수 계약" = '''`~/.codex/harness-review.md`'''

"명시 호출 전용" = ''

"전역 지침" = '''`~/.codex/AGENTS.md`'''

"프로젝트 지침" = '''`AGENTS.md`'''

"경로 한정 지침" = '''경로에 한정되면 해당 경로의 `AGENTS.md`에 두고, 파일 유형에 한정되면 별도 문서(프로젝트 안 또는 전역 `~/.codex/<주제>.md`)로 두어 전역·프로젝트 `AGENTS.md`에서 그 유형을 다룰 때 읽도록 연결한다. 같은 디렉터리의 `AGENTS.override.md`는 `AGENTS.md`보다 우선하며, 루트에서 현재 작업 디렉터리까지 가까운 지침이 앞선 지침을 덮는다.'''

"skill 위치" = '''프로젝트 `.agents/skills/<이름>/SKILL.md` 또는 전역 `~/.agents/skills/<이름>/SKILL.md`'''

"skill 작성 규율" = '''`~/.codex/skill-authoring.md`'''

"agent 위치" = '''프로젝트 `.codex/agents/*.toml` 또는 전역 `~/.codex/agents/*.toml`'''

"agent 작성 규율" = '''`~/.codex/agent-authoring.md`'''

"hook 위치" = '''에이전트 hook은 프로젝트 `.codex/hooks.json`·`.codex/config.toml` 또는 전역 `~/.codex/hooks.json`·`~/.codex/config.toml`에서 관리한다.'''

"추가 구성물" = '''- 샌드박스 밖 명령의 허용·질문·차단만 Codex `.rules`에 둔다.'''

"하네스 검수 agent" = '''`harness_reviewer`'''

"하네스 수정 계약" = '''`~/.codex/harness-revision.md`'''



"worktree 스크립트" = '''~/.codex/scripts/worktree.py'''

"하네스 수정 수행자" = '''수행자는 위임받은 하위 agent이거나 직접 수행하는 주 에이전트다. 위임받은 하위 agent는 위임 절이나 modify-harness·self-diagnose를 다시 사용하지 않고 개정안을 직접 작성하며, 질문과 반환 항목을 주 에이전트에게 반환한다. 직접 수행하는 주 에이전트는 사용자에게 제시한다.'''

"하네스 수정 위임 절" = '''## 위임

주 에이전트가 하위 agent에 맡길 때 따른다.

1. 부모 대화 이력을 상속하는 하위 agent를 생성한다. 하위 agent가 검수자를 직접 호출하려면 `~/.codex/config.toml`의 `[agents] max_depth`가 2 이상이어야 한다. 지시에는 하위 agent의 역할과 따를 계약, 계기가 된 사용자 발화·지점을 적는다.
2. 하위 agent가 결정이 필요한 질문을 반환하면 사용자의 답을, 검수 입력을 반환하면 작성 대화 이력을 전달하지 않은 새 `harness_reviewer`의 검수 보고를 같은 하위 agent에 전달한다.
3. 반환된 개정안은 사용자 승인 전에는 현재 작업의 기준으로 삼지 않는다. 개정안을 사용자에게 제시해 승인받는다.
4. 승인되면 승인된 최종안과 승인 과정의 변경을 같은 하위 agent에 전달한다. 하위 agent가 `승인 후 적용` 절을 따르며, 전달할 수 없으면 주 에이전트가 그 절을 따른다.

위임받은 하위 agent가 검수자를 직접 호출할 수 없으면 `~/.codex/harness-review.md`의 입력을 준비해 반환하고, 주 에이전트가 검수 보고를 전달하면 지적을 처리해 다시 반환한다.'''

"하네스 수정 위임" = '''2. 주 에이전트가 직접 수행한다. 사용자가 위임을 지시·승인하거나, 주 에이전트가 맥락 한계 등으로 이 대화에서 이어갈 작업을 지키기 어렵다고 판단해 위임을 제안하고 승인받으면, 계약의 위임 절에 따라 수정 agent를 생성한다. 역할은 수정 agent, 따를 계약은 `~/.codex/harness-revision.md`이다.'''

"진단 수행자" = '''진단 agent는 self-diagnose skill이 `~/.codex/harness-revision.md`의 위임 절에 따라 생성하고 지시에 그 역할을 명시한 하위 agent다. 진단 agent는 기대와 실제 수행의 어긋남을 진단하고, 재발 방지 개정안을 하네스 수정 계약에 따라 검수까지 거쳐 반환한다. 현재 작업의 교정은 주 에이전트가 맡고, 진단 agent는 그 판단에 쓸 제안만 반환한다.'''

"진단 반환" = '''주 에이전트에게 다음 항목을 반환한다.'''
